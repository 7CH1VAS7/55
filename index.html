<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>API заказов — тест</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        h1 { font-size: 1.4rem; }
        fieldset { border: 1px solid #ccc; border-radius: 6px; margin-bottom: 1rem; padding: .8rem 1rem; }
        legend { font-weight: 600; padding: 0 .4rem; }
        label { display: inline-block; margin: .2rem .8rem .2rem 0; font-size: .9rem; }
        input, select { padding: .3rem; font-size: .9rem; }
        button { padding: .5rem 1rem; font-size: .95rem; cursor: pointer; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; font-size: .85rem; }
        th, td { border: 1px solid #ddd; padding: .35rem .5rem; text-align: left; vertical-align: top; }
        th { background: #f4f4f4; }
        pre { background: #f7f7f7; padding: .8rem; border-radius: 6px; overflow: auto; font-size: .8rem; }
        .msg { padding: .5rem .8rem; border-radius: 6px; margin-bottom: .8rem; }
        .ok { background: #e6f7e6; color: #236b23; }
        .err { background: #fde8e8; color: #8b1a1a; }
    </style>
</head>
<body>

<h1>API заказов — тестовая страница</h1>

<div id="msg"></div>

<fieldset>
    <legend>Фильтр по периоду</legend>
    <label>С: <input type="date" id="from"></label>
    <label>По: <input type="date" id="to"></label>
    <label>Пользователь ID: <input type="number" id="uid" style="width:80px"></label>
    <button id="btnLoad">Загрузить</button>
    <button id="btnAll">За всё время</button>
</fieldset>

<fieldset>
    <legend>Новый заказ</legend>
    <label>user <input type="number" id="f_user" value="265" style="width:80px"></label>
    <label>company <input type="number" id="f_company" value="11" style="width:80px"></label>
    <label>set <input type="number" id="f_set" value="503" style="width:80px"></label>
    <label>hot <input type="number" id="f_hot" value="46" style="width:80px"></label>
    <label>garnish <input type="number" id="f_garnish" value="99" style="width:80px"></label>
    <label>soups <input type="number" id="f_soups" value="116" style="width:80px"></label>
    <label>salads <input type="number" id="f_salads" value="156" style="width:80px"></label>
    <label>date <input type="date" id="f_date"></label>
    <label>comment <input type="text" id="f_comment" placeholder="необязательно" style="width:160px"></label>
    <button id="btnCreate">Создать</button>
</fieldset>

<table id="tbl">
    <thead>
        <tr>
            <th>ID</th><th>Дата</th><th>Пользователь</th><th>Телефон</th>
            <th>Блюда</th><th>Сумма</th><th>Статус</th><th>Действия</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<pre id="raw" style="display:none"></pre>

<script>
const API = '/api/index.php';
// Если открываете как http://localhost:8081/test.html, API = http://localhost:8081/index.php

function showMsg(text, ok = true) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + (ok ? 'ok' : 'err');
    setTimeout(() => { el.textContent = ''; el.className = ''; }, 4000);
}

async function loadOrders() {
    const from = document.getElementById('from').value;
    const to   = document.getElementById('to').value;
    const uid  = document.getElementById('uid').value;
    const q = new URLSearchParams();
    if (from) q.set('date_from', from);
    if (to)   q.set('date_to', to);
    if (uid)  q.set('user_id', uid);

    try {
        const res = await fetch(API + '/orders?' + q.toString());
        const json = await res.json();
        renderTable(json.data || []);
        showMsg(`Загружено: ${(json.data || []).length}`, true);
    } catch (e) {
        showMsg('Ошибка загрузки: ' + e.message, false);
    }
}

function renderTable(rows) {
    const tbody = document.querySelector('#tbl tbody');
    tbody.innerHTML = '';
    for (const r of rows) {
        const u = r.user || {};
        const d = r.dishes || {};
        const dishList = [
            d.hot    ? `Hot: ${d.hot.name} (${d.hot.price}₽)`       : null,
            d.garnish? `Garnish: ${d.garnish.name} (${d.garnish.price}₽)` : null,
            d.soups  ? `Soups: ${d.soups.name} (${d.soups.price}₽)`  : null,
            d.salads ? `Salads: ${d.salads.name} (${d.salads.price}₽)`: null,
        ].filter(Boolean).join('<br>');

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${r.id}</td>
            <td>${r.date}<br><small>${r.datetime}</small></td>
            <td>${[u.surname, u.name, u.patronymic].filter(Boolean).join(' ')}<br><small>ID ${u.id}</small></td>
            <td>${u.phone || ''}</td>
            <td>${dishList}</td>
            <td>${r.total} ₽</td>
            <td>${r.status}</td>
            <td>
                <button data-id="${r.id}" data-action="status">Статус +1</button>
                <button data-id="${r.id}" data-action="delete">Удалить</button>
            </td>
        `;
        tbody.appendChild(tr);
    }
    tbody.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            const action = btn.dataset.action;
            if (action === 'delete') {
                if (!confirm('Удалить заказ ' + id + '?')) return;
                const res = await fetch(API + '/orders/' + id, { method: 'DELETE' });
                const json = await res.json();
                if (res.ok) { showMsg('Удалён ' + id, true); loadOrders(); }
                else showMsg(json.error || 'Ошибка', false);
            }
            if (action === 'status') {
                const current = Number(btn.closest('tr').children[6].textContent);
                const res = await fetch(API + '/orders/' + id, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: current + 1 }),
                });
                const json = await res.json();
                if (res.ok) { showMsg('Статус обновлён', true); loadOrders(); }
                else showMsg(json.error || 'Ошибка', false);
            }
        });
    });
}

async function createOrder() {
    const body = {
        user:    +document.getElementById('f_user').value,
        company: +document.getElementById('f_company').value,
        set:     +document.getElementById('f_set').value,
        hot:     +document.getElementById('f_hot').value,
        garnish: +document.getElementById('f_garnish').value,
        soups:   +document.getElementById('f_soups').value,
        salads:  +document.getElementById('f_salads').value,
        comment: document.getElementById('f_comment').value,
    };
    const d = document.getElementById('f_date').value;
    if (d) body.date = d;

    try {
        const res = await fetch(API + '/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        const json = await res.json();
        if (res.ok) {
            showMsg('Создан заказ id=' + json.data.id, true);
            loadOrders();
        } else {
            showMsg(json.error || 'Ошибка создания', false);
        }
    } catch (e) {
        showMsg('Ошибка: ' + e.message, false);
    }
}

document.getElementById('btnLoad').addEventListener('click', loadOrders);
document.getElementById('btnAll').addEventListener('click', () => {
    document.getElementById('from').value = '';
    document.getElementById('to').value = '';
    document.getElementById('uid').value = '';
    loadOrders();
});
document.getElementById('btnCreate').addEventListener('click', createOrder);

// по умолчанию — сегодня в поле date
document.getElementById('f_date').value = new Date().toISOString().slice(0, 10);

loadOrders();
</script>
</body>
</html>
